<!doctype html>
<html lang="pt-BR" data-theme="minimal" data-layout="card" data-pos="bl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark">
<title>Alive Bot — Widget</title>
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="dns-prefetch" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="dns-prefetch" href="https://www.youtube.com">
<link rel="icon" type="image/webp" href="/img/ic_splash_logo.webp">
<link rel="stylesheet" href="/css/widget.css">
</head>
<body data-video="off" data-start="0">

  <!-- player de áudio nativo (toca streams extraídos diretamente sem restrição de embed) -->
  <audio id="nativeAudio" preload="auto"></audio>

  <!-- player oficial do YouTube (fallback) -->
  <div class="stage"><div id="yt"></div></div>
  <div class="dim"></div>

  <div class="ui">
    <div class="stack">

      <!-- card de reprodução ativo -->
      <div class="card" id="card" hidden>
        <div class="art" id="art">
          <img id="thumb" alt="" draggable="false">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="paused-badge" id="pausedBadge" hidden>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="4" height="16" x="6" y="4"/><rect width="4" height="16" x="14" y="4"/></svg>
          </span>
        </div>
        <div class="meta" id="metaBox">
          <div class="kicker"><span class="dot"></span><span id="kickerText">TOCANDO AGORA</span></div>
          <div class="title" id="title">—</div>
          <div class="sub" id="sub"></div>
          <div class="progress" id="progress">
            <div class="fill" id="fill"><span class="knob"></span></div>
          </div>
          <div class="times"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>
        </div>
        <div class="vol" id="volbox" title="Volume">
          <svg class="vol-icon" id="volIcon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          <span id="volval">70</span>
        </div>
      </div>

      <!-- tela de fila vazia (mesmo formato e dimensões do card) -->
      <div class="card idle" id="idle">
        <div class="art idle-art">
          <img src="/img/ic_splash_logo.webp" alt="Alive Bot" draggable="false">
        </div>
        <div class="meta">
          <div class="kicker"><span class="dot idle-dot"></span><span>ALIVE BOT · AGUARDANDO</span></div>
          <div class="title idle-title">Fila vazia</div>
          <div class="sub">Peça no chat com <b>!play &lt;nome da música&gt;</b></div>
        </div>
      </div>

      <!-- próximas músicas -->
      <div class="next" id="next" hidden>
        <div class="next-head">PRÓXIMAS DA FILA <span class="next-count" id="nextCount"></span></div>
        <ol id="nextList"></ol>
      </div>

      <div class="hint" id="hint">Peça uma música no chat com <b>!play</b></div>
      <div class="brand" id="brand"><img src="/img/ic_splash_logo.webp" alt="" class="brand-badge-img"> ALIVE BOT</div>
    </div>
  </div>

  <!-- aviso de nova música -->
  <div class="toast" id="toast" hidden></div>

  <!-- desbloqueio de áudio quando necessário -->
  <button class="start-overlay" id="startOverlay" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    Clique para iniciar o áudio
  </button>

  <script type="module" src="/js/widget.js"></script>
</body>
</html>
